# fly.toml app configuration file generated for school-student-service on 2026-06-02T10:35:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'school-student-service'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    GITHUB_ACTOR = '${GITHUB_ACTOR}'
    GITHUB_TOKEN = '${GITHUB_TOKEN}'

[env]
  PORT = '8080'
  SPRING_PROFILES_ACTIVE = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
