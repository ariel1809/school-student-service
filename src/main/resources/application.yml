server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: student-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/school_student}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  graphql:
    # classpath*: so the shared dynamic-query schema in the common-lib jar is merged
    # with this service's own *.graphqls files.
    schema:
      locations: "classpath*:graphql/**/"
    graphiql:
      # In-browser explorer at /graphiql (dev convenience; hit the service directly on :8084).
      enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

student:
  matricule:
    prefix: ${STUDENT_MATRICULE_PREFIX:STD}
    pad-width: ${STUDENT_MATRICULE_PAD:5}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
